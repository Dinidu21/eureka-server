name: Bump parent submodule pointer

concurrency:
  group: bump-backend-platform
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  bump-parent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          repository: Dinidu21/backend-platform
          token: ${{ secrets.PARENT_PAT }}
          fetch-depth: 0
          submodules: true

      - name: Update submodule pointer to latest main
        run: |
          git -C "eureka-server" fetch origin main
          git -C "eureka-server" checkout origin/main

      - name: Open PR against parent
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PARENT_PAT }}
          commit-message: "chore: bump eureka-server submodule"
          branch: "bump/eureka-server"
          title: "chore: bump eureka-server submodule"
          body: |
            Automated submodule pointer bump.

            Source repository: Dinidu21/eureka-server
            Parent repository: Dinidu21/backend-platform
            Triggered by push to eureka-server/main.

          delete-branch: true

      - name: Auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.PARENT_PAT }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-url }}" \
  --squash \
  --admin
